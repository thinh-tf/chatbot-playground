# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Groq chat smoke test (target gpt-oss-20b, grader gpt-oss-120b)

prompts:
  - '{{message}}'

providers:
  - id: https
    label: groq-gpt-oss-20b
    config:
      url: https://api.groq.com/openai/v1/chat/completions
      method: POST
      stateful: false
      headers:
        Content-Type: application/json
        Authorization: 'Bearer {{env.GROQ_API_KEY}}'
      body:
        model: openai/gpt-oss-20b
        reasoning_effort: low
        messages:
          - role: user
            content: '{{prompt}}'
      transformResponse: |
        (json) => {
          const content = json?.choices?.[0]?.message?.content;
          if (typeof content !== 'string') throw new Error('Expected string content: ' + JSON.stringify(json?.error ?? json));
          return content;
        }

defaultTest:
  options:
    provider: groq:openai/gpt-oss-120b # llm-rubric grader; reads GROQ_API_KEY

tests: file://tests/*.yaml

# Relative to the cwd, so run from the repo root.
outputPath:
  - promptfoo/results/output.json
  - promptfoo/results/output.html
